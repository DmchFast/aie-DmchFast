services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: artifacts/best_model.pth
      CLASSES_JSON: configs/classes.json
      LOG_LEVEL: INFO
    develop:
      watch:
        - action: sync
          path: ../src
          target: /app/src
        - action: sync
          path: ../configs
          target: /app/configs
        - action: sync
          path: ../artifacts
          target: /app/artifacts
        - action: rebuild
          path: ../requirements.txt
